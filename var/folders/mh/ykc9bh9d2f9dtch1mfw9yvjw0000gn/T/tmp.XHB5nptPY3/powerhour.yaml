version: 1
video:
    width: 1920
    height: 1080
    fps: 30
    codec: libx264
    crf: 20
    preset: medium
audio:
    acodec: aac
    bitrate_kbps: 192
    sample_rate: 48000
    channels: 2
    loudnorm:
        enabled: true
        integrated_lufs: -14
        true_peak_db: -1.5
        lra_db: 11
collections:
    songs:
        plan: songs.yaml
        output_dir: songs
        fade: 1.0
        overlays:
            - type: song-info
        link_header: link
        start_header: start_time
        duration_header: duration
        # field_map controls how yt-dlp cache fields fill this collection's
        # columns. Uncomment to override the defaults:
        # field_map:
        #     title:  [title, track]
        #     artist: [artist, uploader, channel]
        #     link:   [source, links]
    interstitials:
        plan: interstitials.yaml
        output_dir: interstitials
        fade: 1.0
        overlays:
            - type: drink
        link_header: link
        start_header: start_time
        duration_header: duration
timeline:
    sequence:
        # - file: videos/intro.mp4              # optional: play a video before songs start
        #   fade_out: 0.5
        - collection: songs
          slice: start:30                       # adjust to the first half of your total song count
          interleave:
            collection: interstitials
            every: 1
            placement: between                  # between (default), after, before, around
        # - file: videos/intermission.mp4       # optional: play a video between halves
        #   fade: 1.0
        - collection: songs                     # automatically continues from the remaining songs
          interleave:
            collection: interstitials
            every: 1
            placement: between                  # between (default), after, before, around
        # - file: videos/outro.mp4              # optional: play a video after songs end
        #   fade_in: 0.5
outputs:
    segment_template: $INDEX_PAD3_$SAFE_TITLE
plan:
    headers: {}
    default_duration_s: 60
files:
    plan: ""
    cookies: ""
tools: {}
downloads:
    filename_template: $ID
cache:
    view:
        # Each entry is a yt-dlp metadata field shown as its own column in the
        # TUI cache view. Add more fields (uploader, channel, track, album,
        # upload_date) to see additional data; empty cells can be edited via
        # the doctor (press d).
        columns: [title, artist]
    ytdlp:
        # Fields user-typed queries search against in the collection add-clip
        # slot.
        search_fields: [title, artist]
library:
    # mode: shared    # shared (default) or local
    # path: ""        # custom library root override
segments_base_dir: segments
tui:
    # Auto re-render a row in the dashboard right after an inline edit
    # (start_time/duration/etc.) leaves its segment stale. Set to false to
    # only see the stale-row color and re-render manually.
    auto_rerender: true
